appId: com.kura.desktop
productName: Kura
copyright: Copyright © 2026 Kura

directories:
  output: release
  buildResources: build

# 只打必要文件; 源码与 node_modules 一律不进 asar。
files:
  - dist/**/*
  - dist-electron/**/*
  - electron/preload.cjs
  - package.json

# 主进程是 bun 打出来的 ESM, 入口必须显式指定。
extraMetadata:
  main: dist-electron/main.mjs

# 命令行工具: 装到 $INSTDIR\cli\kura.exe。
#
# 为什么必须放子目录: Windows 文件名不区分大小写, `Kura.exe`(GUI) 和 `kura.exe`
# (CLI) 在同一个目录里是同一个文件, 摊在 $INSTDIR 会把 GUI 覆盖掉。
# 源文件由 `node scripts/prepare-cli.mjs` 从 dist/kura.exe 拷过来 (110MB, 不入库)。
extraFiles:
  - from: build/cli/kura.exe
    to: cli/kura.exe

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico

# 安装包: 可选安装目录 + 桌面/开始菜单快捷方式
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kura
  uninstallDisplayName: Kura ${version}
  # 卸载时不删 %APPDATA%\kura: 里面有媒体库索引与配置, 误删代价远大于残留
  deleteAppDataOnUninstall: false
  artifactName: Kura-${version}-setup.exe
  # 把 $INSTDIR\cli 接进用户 PATH, 卸载时还原 —— 脚本里写清了为什么改的是 HKCU
  include: build/installer.nsh

portable:
  artifactName: Kura-${version}-portable.exe

electronLanguages: [zh-CN, en-US]
